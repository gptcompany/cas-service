name: Sandbox Deploy Validation

on:
  workflow_dispatch:
    inputs:
      runner_labels_json:
        description: 'Runner labels JSON (e.g. ["self-hosted","linux","ws"])'
        required: true
        type: string
        default: '["self-hosted","linux","ws"]'
      rebuild_image:
        description: Ignored, the image is always rebuilt (host networking needs the current CAS_HOST support)
        required: true
        type: boolean
        default: false
      leave_running:
        description: Leave docker compose stack running after validation
        required: true
        type: boolean
        default: true

jobs:
  sandbox-validate:
    name: Docker Compose Health Validation
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Resolve CAS port (single source)
        shell: bash
        run: |
          set -euo pipefail
          # Fonte unica: la porta effettiva e' quella risolta da Compose (env, .env o default del file);
          # listener e salute la leggono da CAS_DOCKER_PORT.
          port="$(python3 scripts/sandbox_verify.py port)"
          echo "CAS_DOCKER_PORT=$port" >> "$GITHUB_ENV"

      - name: Require a free port before start
        shell: bash
        run: |
          set -euo pipefail
          # Prima si costruisce l'immagine: un build fallito non deve lasciare il servizio spento.
          docker compose build
          # Si ferma lo stack di questo progetto (se c'e'): ogni altro occupante della porta e' un servizio precedente.
          docker compose down
          python3 scripts/sandbox_verify.py preflight --port "$CAS_DOCKER_PORT"

      - name: Bring up CAS service
        shell: bash
        run: |
          set -euo pipefail
          # L'immagine e' gia' stata costruita sopra (sempre ricostruita): in rete host un'immagine vecchia ignorerebbe CAS_HOST e ascolterebbe su 0.0.0.0.
          docker compose up -d --no-build

      - name: Wait for the compose container to own the loopback listener and serve health
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker compose ps --status running -q cas-service)"
          test -n "$cid"
          python3 scripts/sandbox_verify.py wait --port "$CAS_DOCKER_PORT" --container "$cid"

      - name: Capture compose diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p .artifacts
          docker compose ps > .artifacts/compose-ps.txt || true
          docker compose logs --tail=200 > .artifacts/compose-logs.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cas-service-sandbox-validation
          path: .artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down stack
        if: ${{ always() && !inputs.leave_running }}
        run: docker compose down
